<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Chat</title>
<link href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #36393f;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #chat-container {
        width: 90%;
        max-width: 400px;
        background-color: #2f3136;
        border-radius: 10px;
        padding: 10px;
    }
    #messages-container {
        overflow-y: auto;
        max-height: 60vh;
        padding: 10px;
    }
    .message {
        background-color: #40444b;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
    }
    .user {
        align-self: flex-start;
    }
    .discord {
        align-self: flex-end;
    }
    #input-container {
        display: flex;
        flex-direction: column;
        padding: 10px;
        background-color: #2f3136;
        border-radius: 20px;
        margin-top: 10px;
    }
    #input-message {
        border: none;
        background-color: transparent;
        color: #fff;
        padding: 10px;
        outline: none;
        resize: none;
    }
    .button {
        background-color: #7289da;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 20px;
        margin-top: 10px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    .button:hover {
        background-color: #5f73bc;
    }
    .button:active {
        background-color: #4e5c99;
    }
    #progress-bar {
        width: 100%;
        height: 10px;
        background-color: #ccc;
        border-radius: 5px;
        margin-top: 10px;
        overflow: hidden;
        display: none;
    }
    #progress {
        width: 0;
        height: 100%;
        background-color: #7289da;
    }
    #config-panel {
        padding: 10px;
        background-color: #2f3136;
        border-radius: 20px;
        margin-top: 10px;
    }
    #webhook-container {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
    }
    #webhook-input {
        flex: 1;
        border: none;
        background-color: transparent;
        color: #fff;
        padding: 10px;
        outline: none;
    }
    #remove-file-button {
        background-color: transparent;
        color: #ff6b6b;
        border: none;
        padding: 5px;
        margin-top: 5px;
        cursor: pointer;
        display: none;
    }
    #remove-file-button:hover {
        color: #ff9f9f;
    }
    #file-info {
        color: #bbb;
        margin-top: 5px;
    }
    #file-info img, #file-info audio {
        max-width: 100%;
    }
    #webhook-input{
        position:relative;
        top:5px;
        background-color:rgba(0,0,0,0.15);
        border-radius:10px;
        left:-3px;
    }
    #input-message{
        background-color:rgba(0,0,0,0.23);
        border-radius:15px;
    }
</style>
</head>
<body>
<div id="chat-container" class="container">
    <div id="messages-container" class="mb-3"></div>
    <div id="input-container" class="input-group">
        <textarea id="input-message" class="form-control" placeholder="Digite uma mensagem..."></textarea>
        <div id="file-info"></div>
        <input type="file" id="file-input" class="form-control" style="display: none;" accept="image/*, audio/*, video/*, zip">
        <button id="send-file-button" class="btn btn-primary">Enviar arquivo</button>
        <button id="remove-file-button" class="btn btn-danger" onclick="removeFile()" title="Remover arquivo" style="display: none;">&#10006;</button>
        <button id="send-button" class="btn btn-success">Enviar</button>
    </div>
    <div id="progress-bar" class="progress mt-3">
        <div id="progress" class="progress-bar" role="progressbar"></div>
    </div>
    <div id="config-panel" class="mt-3 p-3">
        <div id="webhook-container" class="input-group">
            <input type="text" id="webhook-input" class="form-control" placeholder="Insira o link do webhook...">
            <button id="update-webhook" class="btn btn-warning">Atualizar Webhook</button>
        </div>
    </div>
</div>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const messagesContainer = document.getElementById("messages-container");
        const inputMessage = document.getElementById("input-message");
        const sendButton = document.getElementById("send-button");
        const fileInput = document.getElementById("file-input");
        const sendFileButton = document.getElementById("send-file-button");
        const removeFileButton = document.getElementById("remove-file-button");
        const fileInfo = document.getElementById("file-info");
        const progressBar = document.getElementById("progress-bar");
        const progress = document.getElementById("progress");
        let xhr;

        sendButton.addEventListener("click", sendMessage);
        inputMessage.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                sendMessage();
            }
        });

        sendFileButton.addEventListener("click", function() {
            fileInput.click();
        });

        fileInput.addEventListener("change", function() {
            const file = fileInput.files[0];
            showFileInfo(file);
        });

        removeFileButton.addEventListener("click", removeFile);

        function sendMessage() {
            const messageText = inputMessage.value.trim();
            const files = fileInput.files;
            const webhookUrl = document.getElementById("webhook-input").value.trim();

            if (webhookUrl === "") {
                alert("Por favor, insira um link de webhook antes de enviar mensagens.");
                return;
            }

            if (messageText === "" && (!files || files.length === 0)) {
                return; // Não envia mensagem vazia ou sem arquivos
            }

            if (files && files.length > 0) {
                const file = files[0];
                xhr = new XMLHttpRequest();
                xhr.open("POST", webhookUrl, true);
                xhr.upload.onprogress = function(event) {
                    const percent = (event.loaded / event.total) * 100;
                    progress.style.width = percent + "%";
                };
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        addMessage("Arquivo enviado", "user");
                    } else {
                        addMessage("Erro ao enviar arquivo", "user");
                    }
                    progressBar.style.display = "none"; // Esconder a barra de progresso após o envio
                };
                const formData = new FormData();
                formData.append("file", file);
                xhr.send(formData);
                progressBar.style.display = "block"; // Mostrar a barra de progresso durante o envio
            } else {
                addMessage(messageText, "user");
                sendToDiscord({ text: messageText, webhookUrl: webhookUrl });
            }

            inputMessage.value = "";
            fileInput.value = ""; // Limpa o campo de arquivo após o envio
            fileInfo.innerHTML = ""; // Limpa as informações do arquivo após o envio

            // Ocultar o botão de remover arquivo
            removeFileButton.style.display = "none";
        }

        function addMessage(message, sender) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message");
            messageDiv.classList.add(sender);

            if (typeof message === "string") {
                // Se a mensagem for texto, adiciona como texto simples
                const messageText = document.createElement("span");
                messageText.textContent = message;
                messageDiv.appendChild(messageText);
            } else {
                // Se a mensagem for um arquivo, cria uma tag <img> para imagens e <audio> para áudio
                if (message.startsWith("data:image")) {
                    const image = document.createElement("img");
                    image.src = message;
                    image.style.maxWidth = "100%";
                    messageDiv.appendChild(image);
                } else if (message.startsWith("data:audio")) {
                    const audio = document.createElement("audio");
                    audio.controls = true;
                    audio.src = message;
                    messageDiv.appendChild(audio);
                }
            }

            messagesContainer.appendChild(messageDiv);

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendToDiscord(data) {
            const formData = new FormData();
            formData.append("content", data.text);

            fetch(data.webhookUrl, {
                method: "POST",
                body: formData
            }).then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao enviar mensagem para o Discord");
                }
            }).catch(error => {
                console.error("Erro:", error);
            });
        }

        function showFileInfo(file) {
            fileInfo.innerHTML = "";

            if (file.type.startsWith("image")) {
                const image = document.createElement("img");
                image.src = URL.createObjectURL(file);
                image.style.maxWidth = "100%";
                fileInfo.appendChild(image);
            } else if (file.type.startsWith("audio")) {
                const audio = document.createElement("audio");
                audio.controls = true;
                audio.src = URL.createObjectURL(file);
                fileInfo.appendChild(audio);
            } else {
                const fileName = document.createElement("span");
                fileName.textContent = "Arquivo selecionado: " + file.name;
                fileInfo.appendChild(fileName);
            }

            // Mostrar o botão de remover arquivo
            removeFileButton.style.display = "inline-block";
        }

        // Função para remover o arquivo
        function removeFile() {
            fileInput.value = ""; // Limpa o campo de arquivo
            fileInfo.innerHTML = ""; // Limpa as informações do arquivo

            // Ocultar o botão de remover arquivo
            removeFileButton.style.display = "none";
        }

        // Carrega o webhook armazenado localmente, se existir
        const storedWebhook = localStorage.getItem("discord_webhook");
        if (storedWebhook !== null && storedWebhook !== "") {
            document.getElementById("webhook-input").value = storedWebhook;
        }

        // Atualiza o webhook ao clicar no botão
        document.getElementById("update-webhook").addEventListener("click", function() {
            const newWebhook = document.getElementById("webhook-input").value.trim();
            if (newWebhook !== "") {
                localStorage.setItem("discord_webhook", newWebhook);
                alert("Webhook atualizado com sucesso!");
            } else {
                alert("Por favor, insira um link de webhook válido.");
            }
        });
    });
</script>
</body>
</html>
